<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 테마를 먼저 정해야 새로고침할 때 흰 화면이 번쩍이지 않음 -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <title>Project — Heeyeon Yang</title>
</head>
<body data-page="project">
  <header id="site-header"></header>

  <main>
    <!-- 내용은 js/pages/project.js가 주소의 ?id= 로 프로젝트를 찾아 그림 -->
    <article class="section project-page">
      <div class="container narrow" id="project-root"></div>
    </article>
  </main>

  <script src="js/i18n.js" defer></script>
  <script src="js/data/projects.js" defer></script>
  <script src="js/data/experience.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/motion.js" defer></script>
  <script src="js/pages/project.js" defer></script>
</body>
</html>
