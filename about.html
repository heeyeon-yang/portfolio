<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 테마를 먼저 정해야 새로고침할 때 흰 화면이 번쩍이지 않음 -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <title>About me — Heeyeon Yang</title>
</head>
<body data-page="about">
  <header id="site-header"></header>

  <main>
    <section class="section">
      <div class="container">
        <div class="page-head">
          <h1 class="page-title" data-i18n="about.title"></h1>
          <!-- TODO: 소개 글 작성 -->
          <p class="about-placeholder" data-i18n="about.placeholder"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/i18n.js" defer></script>
  <script src="js/data/projects.js" defer></script>
  <script src="js/data/experience.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/motion.js" defer></script>
</body>
</html>
