<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 테마를 먼저 정해야 새로고침할 때 흰 화면이 번쩍이지 않음 -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <title>Heeyeon Yang — Cloud & Infrastructure Engineer</title>
  <meta name="description" content="Portfolio of Heeyeon Yang, cloud and infrastructure engineer.">
</head>
<body data-page="home">
  <header id="site-header"></header>

  <main>
    <!-- How I built 배너: 클릭하면 모달 -->
    <div class="built-banner">
      <button type="button" data-open-built>
        <span class="pill" data-i18n="banner.pill"></span>
        <span class="summary" data-i18n="banner.summary"></span>
        <span class="more"><span data-i18n="banner.more"></span> <span class="arrow">&rarr;</span></span>
      </button>
    </div>

    <section class="hero">
      <!-- 아이콘은 landing.js가 여기에 넣음 -->
      <div id="hero-stage" aria-hidden="true"></div>

      <div class="hero-card">
        <!-- 줄마다 따로 움직임 (landing.js). 작은 인사말은 착지할 때 나타남 -->
        <div class="hero-text">
          <p class="hero-greet" data-i18n="hero.greet"></p>
          <h1 class="hero-name" data-i18n="hero.name"></h1>
          <p class="hero-title" data-i18n="hero.title"></p>
        </div>
        <a class="btn btn-primary hero-cta" href="#projects">
          <span data-i18n="hero.cta"></span>
          <svg class="right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <p class="eyebrow" data-i18n="section.projects"></p>
        <div class="project-grid" id="main-projects"></div>

        <div class="side-block">
          <p class="side-heading" data-i18n="section.side"></p>
          <div class="side-list" id="side-projects"></div>
        </div>
      </div>
    </section>

    <section class="section" id="experience">
      <div class="container split">
        <div>
          <p class="eyebrow" data-i18n="section.experience"></p>
          <h2 class="split-title" data-i18n="section.experienceTitle"></h2>
        </div>
        <div>
          <ul id="featured-experience"></ul>
          <a class="more-link" href="experience.html"><span data-i18n="section.allExperience"></span> &rarr;</a>
        </div>
      </div>
    </section>

    <section class="section" id="skills">
      <div class="container split">
        <div>
          <p class="eyebrow" data-i18n="section.skills"></p>
          <h2 class="split-title" data-i18n="section.skillsTitle"></h2>
        </div>
        <div id="skills-certs"></div>
      </div>
    </section>

    <section class="section">
      <div class="container" id="resume"></div>
    </section>
  </main>

  <script src="js/i18n.js" defer></script>
  <script src="js/data/projects.js" defer></script>
  <script src="js/data/experience.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/pages/home.js" defer></script>
  <script src="js/vendor/matter.min.js" defer></script>
  <script src="js/landing.js" defer></script>
</body>
</html>
