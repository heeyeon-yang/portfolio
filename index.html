<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <title>Heeyeon Yang — Cloud & Infrastructure Engineer</title>
  <meta name="description" content="Portfolio of Heeyeon Yang, cloud and infrastructure engineer.">
</head>
<body data-page="home">
  <header id="site-header"></header>

  <main>
    <div class="built-banner">
      <button type="button" data-open-built>
        <span class="pill"><span class="live-dot" aria-hidden="true"></span><span data-i18n="banner.pill"></span></span>
        <span class="summary" data-i18n="banner.summary"></span>
        <span class="more"><span data-i18n="banner.more"></span> <span class="arrow">&rarr;</span></span>
      </button>
    </div>

    <section class="hero">
      <div id="hero-stage" aria-hidden="true"></div>

      <div class="hero-card">
        <div class="hero-text">
          <p class="hero-greet">Hello, I'm</p>
          <h1 class="hero-name">Heeyeon Yang</h1>
          <p class="hero-title">Cloud &amp; Infrastructure Engineer</p>
        </div>
        <a class="btn btn-primary btn-fill hero-cta" href="#projects">
          <span class="cta-label">Projects</span>
          <span class="cta-arrow" aria-hidden="true">
            <svg class="right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <div class="section-head">
          <h2 class="split-title" data-i18n="section.projects"></h2>
          <a class="more-link" href="projects.html"><span data-i18n="section.allProjects"></span> &rarr;</a>
        </div>
        <div class="project-grid" id="main-projects"></div>

        <div class="side-block split">
          <div><h2 class="split-title" data-i18n="section.side"></h2></div>
          <div>
            <div class="side-list" id="side-projects"></div>
            <a class="more-link" href="projects.html?type=side"><span data-i18n="section.allSide"></span> &rarr;</a>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="experience">
      <div class="container split">
        <div>
          <h2 class="split-title" data-i18n="section.experienceTitle"></h2>
        </div>
        <div>
          <ul id="featured-experience"></ul>
          <a class="more-link" href="experience.html"><span data-i18n="section.allExperience"></span> &rarr;</a>
        </div>
      </div>
    </section>

    <section class="section" id="skills">
      <div class="container split">
        <div>
          <h2 class="split-title" data-i18n="section.skillsTitle"></h2>
        </div>
        <div id="skills-certs"></div>
      </div>
    </section>

    <section class="section">
      <div class="container" id="resume"></div>
    </section>
  </main>

  <script src="js/i18n.js" defer></script>
  <script src="js/data/projects.js" defer></script>
  <script src="js/data/experience.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/motion.js" defer></script>
  <script src="js/pages/home.js" defer></script>
  <script src="js/vendor/matter.min.js" defer></script>
  <script src="js/landing.js" defer></script>
  <script src="js/marquee.js" defer></script>
</body>
</html>
